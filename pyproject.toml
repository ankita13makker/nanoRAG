[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanorag"
version = "0.1.0"
description = "Lightweight BM25 knowledge retrieval for Salesforce Agentforce agents"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "striprtf>=0.0.26",
    "requests>=2.31.0",
    "certifi>=2024.2.2",
    "simple-salesforce>=1.12.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/salesforce/nanorag"

[tool.setuptools.packages.find]
include = ["nanorag*"]
